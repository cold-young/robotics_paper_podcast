<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dexterous Manipulation Daily Podcast</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a2e;
      --primary: #6c63ff;
      --primary-dim: #4a44b3;
      --text: #e0e0e0;
      --text-muted: #888;
      --border: #2a2a3e;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Pretendard', -apple-system, 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }
    header {
      text-align: center;
      margin-bottom: 2.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 0.3rem;
      background: linear-gradient(135deg, #6c63ff, #48cfcb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* ── Player ── */
    .player {
      background: var(--surface);
      border-radius: 16px;
      padding: 1.8rem;
      margin-bottom: 2rem;
      border: 1px solid var(--border);
    }
    .player-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
    }
    .player-date {
      color: var(--text-muted);
      font-size: 0.82rem;
      margin-bottom: 1rem;
    }
    audio {
      width: 100%;
      margin-bottom: 1rem;
      border-radius: 8px;
    }
    audio::-webkit-media-controls-panel {
      background: #222;
    }

    /* ── Paper Links ── */
    .papers {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .papers a {
      color: var(--primary);
      text-decoration: none;
      font-size: 0.85rem;
      padding: 0.3rem 0;
      transition: color 0.2s;
    }
    .papers a:hover {
      color: #48cfcb;
    }
    .papers a::before {
      content: '📄 ';
    }

    /* ── Episode List ── */
    .episode-list {
      list-style: none;
    }
    .episode-list li {
      padding: 1rem 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
    }
    .episode-list li:hover {
      background: rgba(108, 99, 255, 0.06);
    }
    .episode-list li.active {
      border-left: 3px solid var(--primary);
      padding-left: 1rem;
    }
    .ep-title {
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 0.2rem;
    }
    .ep-meta {
      color: var(--text-muted);
      font-size: 0.8rem;
    }
    h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--text-muted);
    }
    footer {
      text-align: center;
      margin-top: 3rem;
      color: var(--text-muted);
      font-size: 0.75rem;
    }
    footer a { color: var(--primary); text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🤖 Dexterous Manipulation Daily</h1>
      <p>arXiv 논문 기반 한국어 AI 팟캐스트</p>
    </header>

    <div class="player" id="player">
      <div class="player-title" id="player-title">에피소드를 선택하세요</div>
      <div class="player-date" id="player-date"></div>
      <audio controls id="audio-el">
        <source id="audio-src" src="" type="audio/mpeg">
      </audio>
      <div class="papers" id="paper-links"></div>
    </div>

    <h2>에피소드 목록</h2>
    <ul class="episode-list" id="episode-list"></ul>

    <footer>
      Powered by <a href="https://github.com/cold-young/robotics_paper_daily">robotics_paper_daily</a>
      + MeloTTS
    </footer>
  </div>

  <script>
    let episodes = [];

    async function loadEpisodes() {
      const resp = await fetch('episodes.json');
      episodes = await resp.json();
      renderList();
      if (episodes.length > 0) selectEpisode(0);
    }

    function renderList() {
      const ul = document.getElementById('episode-list');
      ul.innerHTML = episodes.map((ep, i) => `
        <li onclick="selectEpisode(${i})" id="ep-${i}">
          <div class="ep-title">${ep.title}</div>
          <div class="ep-meta">${ep.date} · ${ep.duration || ''}</div>
        </li>
      `).join('');
    }

    function selectEpisode(idx) {
      const ep = episodes[idx];
      document.getElementById('player-title').textContent = ep.title;
      document.getElementById('player-date').textContent = `${ep.date} · ${ep.duration || ''}`;
      const audioEl = document.getElementById('audio-el');
      document.getElementById('audio-src').src = ep.audio_file;
      audioEl.load();

      // Paper links
      const linksDiv = document.getElementById('paper-links');
      if (ep.papers && ep.papers.length > 0) {
        linksDiv.innerHTML = ep.papers.map(p =>
          `<a href="${p.url}" target="_blank">${p.title}</a>`
        ).join('');
      } else {
        linksDiv.innerHTML = '';
      }

      // Active state
      document.querySelectorAll('.episode-list li').forEach(li => li.classList.remove('active'));
      document.getElementById(`ep-${idx}`).classList.add('active');
    }

    loadEpisodes();
  </script>
</body>
</html>
